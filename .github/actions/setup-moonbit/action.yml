name: Set up MoonBit
description: Install the pinned MoonBit toolchain used by this repository.

inputs:
  moonbit-version:
    description: MoonBit installer channel or version to install.
    required: false
    default: "latest"
  expected-moon-version:
    description: Expected moon version after installation.
    required: false
    default: "0.1.20260512 (81d40e3 2026-05-12)"
  expected-moonc-version:
    description: Expected moonc version after installation.
    required: false
    default: "v0.9.2+bbe2b338f (2026-05-12)"
  expected-moonrun-version:
    description: Expected moonrun version after installation.
    required: false
    default: "moonrun 0.1.20260512 (81d40e3 2026-05-12)"
  update-deps:
    description: Run moon update after installing the toolchain.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"

    - name: Install MoonBit
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.moonbit-version }}
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Show toolchain versions
      shell: bash
      run: moon version --all

    - name: Verify MoonBit toolchain versions
      shell: bash
      env:
        EXPECTED_MOON_VERSION: ${{ inputs.expected-moon-version }}
        EXPECTED_MOONC_VERSION: ${{ inputs.expected-moonc-version }}
        EXPECTED_MOONRUN_VERSION: ${{ inputs.expected-moonrun-version }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import subprocess
        import sys

        expected = {
            "moon": os.environ["EXPECTED_MOON_VERSION"],
            "moonc": os.environ["EXPECTED_MOONC_VERSION"],
            "moonrun": os.environ["EXPECTED_MOONRUN_VERSION"],
        }
        output = subprocess.check_output(
            ["moon", "version", "--all", "--json"],
            text=True,
        )
        actual = {
            item["name"]: item["version"]
            for item in json.loads(output)["items"]
        }
        mismatches = [
            (name, expected_version, actual.get(name, "<missing>"))
            for name, expected_version in expected.items()
            if actual.get(name) != expected_version
        ]
        if mismatches:
            for name, expected_version, actual_version in mismatches:
                print(
                    f"{name} version drifted: expected {expected_version}, got {actual_version}",
                    file=sys.stderr,
                )
            sys.exit(1)
        PY

    - name: Update MoonBit dependencies
      if: ${{ inputs.update-deps == 'true' }}
      shell: bash
      run: moon update
