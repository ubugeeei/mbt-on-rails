name: Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain versions
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check formatting and interfaces
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Build supported targets
        run: |
          moon build --target js
          moon build --target wasm-gc
          moon build --target native

      - name: Run checks and tests
        run: |
          moon check
          moon test
          moon test --target js
          moon test --target wasm-gc

      - name: Validate example template assets
        run: scripts/validate_template_assets.py

      - name: Validate package boundary
        run: scripts/validate_package_boundary.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon-package-${{ github.ref_name }}
          path: _build/publish/*.zip
          if-no-files-found: error
