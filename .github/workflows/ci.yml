name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Check formatting and interfaces
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Run checks
        run: scripts/check_moon_warnings.sh

      - name: Run IDE semantic smoke checks
        run: |
          moon ide outline src/metrics/render.mbt
          moon ide doc render_prometheus
          moon ide peek-def render_prometheus
          moon ide analyze > /tmp/moon-ide-analyze.txt
          test -s /tmp/moon-ide-analyze.txt

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            command: moon build
          - target: js
            command: moon build --target js
          - target: wasm-gc
            command: moon build --target wasm-gc
          - target: native
            command: moon build --target native

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Build ${{ matrix.target }}
        env:
          MOON_COMMAND: ${{ matrix.command }}
        run: $MOON_COMMAND

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            command: moon test
          - target: js
            command: moon test --target js
          - target: wasm-gc
            command: moon test --target wasm-gc
          - target: native
            command: moon test --target native

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Test ${{ matrix.target }}
        env:
          MOON_COMMAND: ${{ matrix.command }}
        run: $MOON_COMMAND

  runtime:
    name: Runtime examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Run production examples
        run: scripts/run_documented_examples.sh

      - name: Validate example template assets
        run: scripts/validate_template_assets.py

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Validate package artifact
        run: scripts/validate_package_boundary.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moon-package-${{ github.run_id }}
          path: _build/publish/*.zip
          if-no-files-found: error
          retention-days: 14

  moonbit:
    name: moonbit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - build
      - test
      - runtime
      - package
    if: ${{ always() }}

    steps:
      - name: Summarize split checks
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] != "success"
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          print("All split CI jobs passed.")
          PY
