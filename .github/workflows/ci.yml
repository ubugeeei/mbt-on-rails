name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Check formatting and interfaces
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Build default target
        run: moon build

      - name: Build JavaScript target
        run: moon build --target js

      - name: Build WebAssembly GC target
        run: moon build --target wasm-gc

      - name: Build native target
        run: moon build --target native

      - name: Run checks
        run: moon check

      - name: Run IDE semantic smoke checks
        run: |
          moon ide outline src/metrics/render.mbt
          moon ide doc render_prometheus
          moon ide peek-def render_prometheus
          moon ide analyze > /tmp/moon-ide-analyze.txt
          test -s /tmp/moon-ide-analyze.txt

      - name: Run tests
        run: moon test

      - name: Run JavaScript target tests
        run: moon test --target js

      - name: Run WebAssembly GC target tests
        run: moon test --target wasm-gc

      - name: Run production examples
        run: |
          moon run examples/production_api
          moon run examples/production_stack

      - name: Validate example template assets
        run: scripts/validate_template_assets.py

      - name: Validate package artifact
        run: scripts/validate_package_boundary.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moon-package-${{ github.run_id }}
          path: _build/publish/*.zip
          if-no-files-found: error
          retention-days: 14
